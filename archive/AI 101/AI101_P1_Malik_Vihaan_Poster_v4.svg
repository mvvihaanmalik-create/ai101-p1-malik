<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Poster: a hand-drawn eye with a spiral iris inside a large disc, with a column of sketched glyphs alongside">

  <!--
    AI 101 / Project 1 - Student AI-Art Pin-Up
    Concept: "The Machine Eye" - editorial plate, three colours

    STRICT THREE COLOURS. No gradients, no partial opacity, no filters - all
    three of those generate intermediate values and would break the count.
    Lightness is carried by line weight and dash density instead.

      forest    #384640   field, spiral pupil
      butter    #FFE8A1   ink, rules, registration
      vermilion #F56543   aperture, folio marks

    Layout drawn from the context-kit references:
      - Open Cosmos: centred circular aperture, wide margins, four-corner
        registration, hairline rules top and bottom holding the type band.
      - Sereth glyph board: glyphs on a disciplined column, evenly pitched,
        not scattered.
      - Palette board: modular sidebar against a hero field.

    Live area 96-1104. Sidebar 96-276. Hero 300-1104. Column pitch 136.
  -->

  <defs>
    <!-- ===== bespoke sketch glyphs, drawn loose around origin ===== -->
    <g id="g-crescent" fill="none" stroke="#FFE8A1" stroke-width="3.4" stroke-linecap="round">
      <path d="M7,-25 C-16,-19 -24,3 -9,21"/>
      <path d="M7,-25 C-5,-14 -8,5 -9,21"/>
      <circle cx="19" cy="-13" r="3.6" fill="#FFE8A1" stroke="none"/>
    </g>

    <g id="g-spiral" fill="none" stroke="#FFE8A1" stroke-width="3.2" stroke-linecap="round">
      <path d="M1,1 C5,-4 11,-1 10,5 C9,13 1,16 -6,11 C-15,5 -16,-6 -8,-13 C2,-22 17,-19 22,-9"/>
    </g>

    <g id="g-waves" fill="none" stroke="#FFE8A1" stroke-width="3.2" stroke-linecap="round">
      <path d="M-26,-9 C-18,-18 -9,1 -1,-8 C7,-17 15,1 25,-9"/>
      <path d="M-25,2 C-16,-7 -8,11 0,2 C8,-6 16,11 26,1"/>
      <path d="M-26,13 C-17,4 -9,21 -1,12 C7,4 15,21 25,12"/>
    </g>

    <g id="g-mountain" fill="none" stroke="#FFE8A1" stroke-width="3.4" stroke-linecap="round">
      <path d="M-29,15 C-20,2 -13,-9 -9,-15 C-5,-8 -1,0 2,5 C6,-2 10,-8 13,-9 C19,0 25,9 29,15"/>
      <circle cx="16" cy="-21" r="4" fill="#FFE8A1" stroke="none"/>
    </g>

    <g id="g-sprout" fill="none" stroke="#FFE8A1" stroke-width="3.2" stroke-linecap="round">
      <path d="M0,23 C1,9 2,-4 0,-19"/>
      <path d="M0,3 C-11,1 -17,-7 -16,-16 C-7,-16 -1,-9 0,1"/>
      <path d="M1,-7 C10,-10 15,-17 14,-25 C6,-24 1,-17 1,-8"/>
    </g>

    <g id="g-sun" fill="none" stroke="#FFE8A1" stroke-width="3.2" stroke-linecap="round">
      <circle cx="0" cy="0" r="8.5"/>
      <path d="M0,-14 L1,-25"/><path d="M10,-10 L18,-19"/>
      <path d="M14,0 L26,-1"/><path d="M10,10 L19,17"/>
      <path d="M0,14 L-1,24"/><path d="M-10,10 L-18,18"/>
      <path d="M-14,0 L-25,1"/><path d="M-10,-10 L-17,-18"/>
    </g>

    <g id="g-stylus" fill="none" stroke="#FFE8A1" stroke-width="3.4" stroke-linecap="round">
      <path d="M-13,19 L9,-14"/>
      <path d="M-13,19 L-18,25 L-9,23 Z" fill="#FFE8A1" stroke="none"/>
      <path d="M2,-4 L-6,-9"/>
      <path d="M9,-14 C12,-19 15,-22 18,-24"/>
      <path d="M14,8 L22,6"/><path d="M12,16 L19,17"/>
    </g>

    <g id="g-pin" fill="none" stroke="#FFE8A1" stroke-width="3.2" stroke-linecap="round">
      <circle cx="0" cy="-11" r="8" fill="#FFE8A1" stroke="none"/>
      <path d="M0,-3 C1,4 1,12 0,22"/>
      <path d="M-9,-16 C-13,-20 -13,-25 -9,-27"/>
    </g>
  </defs>

  <!-- ===================== FIELD ===================== -->
  <rect x="0" y="0" width="1200" height="1200" fill="#384640"/>

  <!-- ===================== EDITORIAL FURNITURE ===================== -->

  <!-- four-corner registration, Open Cosmos anchoring -->
  <g fill="none" stroke="#FFE8A1" stroke-width="2.4" stroke-linecap="square">
    <path d="M96,140 L96,96 L140,96"/>
    <path d="M1060,96 L1104,96 L1104,140"/>
    <path d="M96,1060 L96,1104 L140,1104"/>
    <path d="M1104,1060 L1104,1104 L1060,1104"/>
  </g>

  <!-- hairline rules holding the plate -->
  <g stroke="#FFE8A1" stroke-width="1.6">
    <path d="M96,168 L1104,168"/>
    <path d="M96,1032 L1104,1032"/>
  </g>

  <!-- rule ticks, print-shop cadence -->
  <g stroke="#FFE8A1" stroke-width="1.6">
    <path d="M96,168 L96,186"/>
    <path d="M276,168 L276,182"/>
    <path d="M1104,168 L1104,186"/>
    <path d="M96,1014 L96,1032"/>
    <path d="M276,1018 L276,1032"/>
    <path d="M1104,1014 L1104,1032"/>
  </g>

  <!-- sidebar divider -->
  <path d="M276,204 L276,996" stroke="#FFE8A1" stroke-width="1.2" stroke-dasharray="2 9"/>

  <!-- folio marks, the vermilion carried out of the aperture -->
  <rect x="171" y="196" width="30" height="30" fill="#F56543"/>
  <rect x="146" y="944" width="80" height="7" fill="#F56543"/>

  <!-- ===================== SIDEBAR GLYPH COLUMN ===================== -->
  <!-- evenly pitched at 136, after the Sereth glyph board -->
  <g>
    <use href="#g-crescent" transform="translate(186 300) rotate(-7) scale(1.35)"/>
    <use href="#g-spiral"   transform="translate(186 436) rotate(5) scale(1.35)"/>
    <use href="#g-waves"    transform="translate(186 572) scale(1.3)"/>
    <use href="#g-mountain" transform="translate(186 708) rotate(-4) scale(1.35)"/>
    <use href="#g-sprout"   transform="translate(186 844) rotate(6) scale(1.35)"/>
  </g>

  <!-- ===================== HERO APERTURE ===================== -->

  <!-- concentric guide arcs; lightness from dash density, not opacity -->
  <g fill="none" stroke="#FFE8A1" stroke-width="1.1">
    <circle cx="700" cy="600" r="322" stroke-dasharray="2 12"/>
    <circle cx="700" cy="600" r="350" stroke-dasharray="1 16"/>
  </g>

  <circle cx="700" cy="600" r="290" fill="#F56543"/>

  <g transform="translate(700 600)">

    <!-- lashes / rays, hand-struck -->
    <g fill="none" stroke="#FFE8A1" stroke-width="4.2" stroke-linecap="round">
      <path d="M-196,-62 C-206,-74 -214,-84 -224,-92"/>
      <path d="M-141,-96 C-149,-110 -155,-122 -161,-134"/>
      <path d="M-74,-118 C-79,-134 -82,-148 -85,-162"/>
      <path d="M0,-126 C0,-143 1,-158 2,-173"/>
      <path d="M74,-118 C79,-134 83,-147 87,-161"/>
      <path d="M141,-96 C150,-109 157,-121 164,-132"/>
      <path d="M196,-62 C207,-72 216,-82 226,-90"/>
      <path d="M-186,68 C-197,79 -206,88 -216,95"/>
      <path d="M0,124 C0,140 -1,153 -2,167"/>
      <path d="M186,68 C197,78 207,87 217,94"/>
    </g>

    <!-- upper lid, doubled for a drawn feel -->
    <path d="M-232,6 C-176,-104 -74,-146 4,-146 C86,-146 180,-100 232,4"
          fill="none" stroke="#FFE8A1" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M-214,-4 C-160,-96 -68,-134 4,-135 C80,-136 168,-94 216,-8"
          fill="none" stroke="#FFE8A1" stroke-width="2.2" stroke-linecap="round"/>

    <!-- lower lid -->
    <path d="M-232,6 C-178,102 -80,142 2,142 C88,142 182,98 232,4"
          fill="none" stroke="#FFE8A1" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M-206,18 C-156,92 -74,126 2,127 C82,128 164,90 208,14"
          fill="none" stroke="#FFE8A1" stroke-width="2" stroke-linecap="round"/>

    <!-- iris, flat butter -->
    <circle cx="0" cy="-2" r="90" fill="#FFE8A1"/>

    <!-- spiral pupil in the field colour, closing the three-way interlock -->
    <path d="M6,-6 C22,-10 34,4 30,22 C25,44 2,53 -19,44 C-45,33 -52,2 -37,-21 C-19,-48 19,-54 42,-36 C58,-24 65,-8 64,8"
          fill="none" stroke="#384640" stroke-width="9.5" stroke-linecap="round"/>
    <circle cx="6" cy="-6" r="7" fill="#384640"/>
  </g>

  <!-- ===================== BASELINE GLYPH ROW ===================== -->
  <g>
    <use href="#g-stylus" transform="translate(520 952) rotate(4) scale(1.15)"/>
    <use href="#g-pin"    transform="translate(700 952) rotate(-3) scale(1.15)"/>
    <use href="#g-sun"    transform="translate(880 952) rotate(5) scale(1.15)"/>
  </g>

</svg>
