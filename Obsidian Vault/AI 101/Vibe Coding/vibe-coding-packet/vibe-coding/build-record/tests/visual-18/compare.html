<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room 0 · Visual study</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#11100f;color:#f0e5cf;max-width:1440px;margin:auto;padding:clamp(16px,4vw,60px);font:16px/1.5 system-ui}h1{font:normal clamp(30px,4vw,54px)/1.1 Georgia,serif;margin:.25em 0}p{color:#c7bcb0}.k{font:600 .8rem system-ui;letter-spacing:.18em;color:#cead75}select{background:#302822;color:inherit;padding:.45em .8em;border:1px solid #78694e;font:inherit}.viewer{position:relative;aspect-ratio:16/9;background:#1e1815;overflow:hidden;margin-top:1em;--cut:50%}.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.viewer #old{clip-path:inset(0 calc(100% - var(--cut)) 0 0)}.viewer:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:#ead8ba;left:var(--cut)}.bar{display:grid;grid-template-columns:auto 1fr auto;gap:1em;align-items:center;margin-top:.65em}input{accent-color:#b99a63;width:100%}label{margin-right:.5em}
</style>
<div class="k">ROOM 0 / VISUAL STUDY</div><h1>The same hotel, a closer look.</h1>
<p>Choose a scene, then drag the divider. Both images are game captures. Character poses and randomized suitcase stamps can differ between runs.</p>
<label for="shot">Scene</label><select id="shot"></select>
<div class="viewer"><img id="new" alt="Updated game capture"><img id="old" alt="Previous game capture"></div>
<div class="bar"><span>v17</span><input aria-label="Before and after divider" type="range" min="0" max="100" value="50"><span>v18</span></div>
<script>
const menu=document.querySelector('select'),viewer=document.querySelector('.viewer');
for(const [id,label] of Object.entries({'porter-recognizes-case':'Left luggage','desk':'Reception','lift-wide':'Broken lift','gallery':'West gallery','stairs':'East stair','suite-door':'Honeymoon suite','night-bar':'Night bar','dog':'The dog','bell':'The butler’s bell','luggage':'The traveller','mirror':'Gallery mirror','children':'The children','bones':'Ending: the butler','surround':'Ending: the guests'}))menu.add(new Option(label,id));
function change(){for(const [id,dir] of [['old','before'],['new','after']])document.getElementById(id).src=dir+'/'+menu.value+'.jpg';}
menu.onchange=change;change();document.querySelector('input').oninput=e=>viewer.style.setProperty('--cut',e.target.value+'%');
</script></html>
