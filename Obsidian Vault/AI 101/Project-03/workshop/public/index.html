<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11251d"><title>idea.quest · Workshop</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script><script src="/characters.js" defer></script></head>
<body><div id="workshop"><nav class="suite-nav" aria-label="Your connected apps"><button class="suite-app current" data-app="workshop" aria-pressed="true"><span class="suite-symbol workshop-symbol" aria-hidden="true">✦</span><span>Workshop</span></button><button class="suite-app" data-app="ideaquest" aria-pressed="false"><span class="suite-symbol quest-symbol" aria-hidden="true"></span><span>idea.quest</span></button><button class="suite-app" data-app="shelf" aria-pressed="false"><span class="suite-symbol shelf-symbol" aria-hidden="true"></span><span>Design Shelf</span></button></nav><div class="iq-window">
  <header class="iq-top"><a class="iq-brand" href="/" aria-label="idea.quest home"><span class="iq-jar" aria-hidden="true"></span><span>idea<b>.</b>quest</span></a><label class="iq-top-project"><select id="project" aria-label="Current project"><option>Connecting notes…</option></select></label><button id="connection" class="iq-button">Connect agents</button><button id="theme" class="theme-toggle" type="button" aria-label="Switch to day mode" title="Switch to day mode"></button></header>
  <div class="iq-shell"><nav class="iq-nav" aria-label="Workshop and agents"></nav><main class="iq-main"><div class="iq-view-head"><div><p class="iq-eyebrow" id="eyebrow" hidden></p><h1 id="title" tabindex="-1">Opening your workshop…</h1></div><details class="workflow-progress"><summary id="progress-label">Progress</summary><div class="iq-journey" aria-label="Your five approval gates"></div></details><span id="gate-count" class="iq-note" hidden></span></div><section id="workflow-focus" aria-label="Current step" aria-live="polite"></section><div id="alerts"></div><div id="content"></div></main></div>
  <section id="suite-views" hidden aria-label="Connected app"><div id="suite-status" role="status"></div><div id="suite-frames"></div></section>
  <footer class="iq-footer"><span id="footer">Local workspace</span></footer>
</div><div id="toast" role="status" aria-live="polite" hidden></div></div></body></html>
